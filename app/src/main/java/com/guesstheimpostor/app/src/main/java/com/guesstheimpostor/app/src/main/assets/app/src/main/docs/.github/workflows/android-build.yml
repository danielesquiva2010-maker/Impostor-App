name: Build Android AAB

on:
  push:
    branches:
      - main
      - feature/reveal-touch-emoji-packs
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK (r0adkll/setup-android)
        uses: r0adkll/setup-android@v2
        with:
          api-level: 33
          build-tools: '33.0.2'

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Decode keystore (if KEYSTORE_BASE64 provided)
        if: secrets.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > ./keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build release AAB (signed if keystore and secrets present)
        run: |
          set -e
          EXTRA_ARGS=""
          if [ -f ./keystore.jks ]; then
            EXTRA_ARGS="$EXTRA_ARGS -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks"
            EXTRA_ARGS="$EXTRA_ARGS -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }}"
            EXTRA_ARGS="$EXTRA_ARGS -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }}"
            EXTRA_ARGS="$EXTRA_ARGS -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}"
          fi
          ./gradlew clean bundleRelease $EXTRA_ARGS --no-daemon --stacktrace
        shell: bash

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
